[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[project]
name = "open-paper"
version = "0.1.0"
requires-python = ">= 3.12"
description = "An Application to Read & Understand Papers with AI"
readme = "README.md"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn>=0.34",
    "pydantic[email]>=2.10",
    "python-dotenv>=1.0.1",
    "google-genai==2.18.0",
    "requests>=2.32.4",
    "sqlalchemy>=2.0.39",
    "psycopg2-binary>=2.9.10",
    "alembic>=1.15.1",
    "python-multipart>=0.0.22",
    "pydantic-settings>=2.8.1",
    "types-psycopg2>=2.9.21.20250318",
    "types-requests>=2.32.0.20250306",
    "sqlalchemy2-stubs>=0.0.2a38",
    "boto3>=1.37.33",
    "types-boto3>=1.37.33",
    "gunicorn>=23.0.0",
    "openai==3.8.0",
    "anthropic==1.3.0",
    "pillow>=12.1.1",
    "resend>=2.10.0",
    "celery>=5.5.3",
    "redis>=5.0.0",
    "pypdf2>=3.0.1",
    "exa-py>=1.0.0",
    "logfire[celery,fastapi,httpx,sqlalchemy,system-metrics]==4.41.0",
    "opentelemetry-instrumentation-google-genai==0.7b1",
    "pydantic-ai==2.44.0",
    "genai-prices==0.1.7",
    # Imported directly (retrying_model, _pai_compat, model_registry) — the SDKs
    # moved to it — so declared rather than left to arrive transitively.
    "httpx2==2.13.0",
    "pydantic-monty==0.0.21",
    "regex>=2026.4.4",
]

[project.scripts]
# openpaper = "app.main"
start = "app:start"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.mypy]
plugins = [
    "sqlalchemy.ext.mypy.plugin",
]
show_error_codes = true
strict = true

[tool.uv]
exclude-newer = "2026-09-17T23:59:59Z"
