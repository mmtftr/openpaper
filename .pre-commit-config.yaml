repos:
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
    -   id: trailing-whitespace
    -   id: end-of-file-fixer
    -   id: check-yaml
    -   id: check-added-large-files

# Ruff from server/uv.lock, so the hook and `server/scripts/check.sh` agree.
-   repo: local
    hooks:
    -   id: ruff-check
        name: ruff check
        entry: uv run --frozen --project server ruff check --fix
        language: system
        types: [python]
        files: ^server/
    -   id: ruff-format
        name: ruff format
        entry: uv run --frozen --project server ruff format
        language: system
        types: [python]
        files: ^server/
